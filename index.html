        <p>
          <dfn>Mudhop</dfn> is old railroad slang for a yard clerk. The mascot is based on Walt
          Dunning’s “P.E. Mudhops,” published in <cite>Pacific Electric Magazine</cite> in 1944.
          <a
            class="source-link"
